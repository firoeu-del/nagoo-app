name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, agent/android-startup-fix]
    paths:
      - "nagoo-source.zip"
      - "source-parts/**"
      - "SOURCE_SHA256.txt"
      - "android-tools/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and launch installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Extract app source
        run: |
          if [ -d source-parts ]; then
            cat source-parts/nagoo-source.zip.part-* > nagoo-source.zip
          fi
          sha256sum --check SOURCE_SHA256.txt
          mkdir -p app
          unzip -q nagoo-source.zip -d app
          test -f app/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript
        working-directory: app
        run: npm run typecheck

      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Build standalone release APK
        working-directory: app/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk Nagoo-v1.37.1.apk
          test -s Nagoo-v1.37.1.apk
          sha256sum Nagoo-v1.37.1.apk > Nagoo-v1.37.1.apk.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: bash android-tools/runtime-smoke.sh Nagoo-v1.37.1.apk

      - name: Upload Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagoo-android-runtime-diagnostics
          path: android-runtime-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nagoo-v1.37.1-android-apk
          path: |
            Nagoo-v1.37.1.apk
            Nagoo-v1.37.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
